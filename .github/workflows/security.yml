name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Shipped code (CLI + web server) must have zero advisories.
      - name: Production dependencies are clean
        run: npm audit --omit=dev --audit-level=low

      # The remaining moderate advisories are build-time-only (glob/minimatch
      # inside ESLint and electron-builder). They are tracked by Dependabot;
      # this gate blocks any high or critical advisory anywhere.
      - name: No high or critical advisories in the build toolchain
        run: npm audit --audit-level=high
