# Shared Electron release pipeline: michael-borck/app-hq/.github/workflows/electron-release.yml
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    uses: ./.github/workflows/ci.yml

  desktop:
    needs: preflight
    uses: michael-borck/app-hq/.github/workflows/electron-release.yml@main
    with:
      product-name: Playable Lessons
      node-version: '22'
      install-command: npm ci --legacy-peer-deps
      build-command: npm run build
      package-command: npx electron-builder --$PLATFORM --publish never
      notarize-check-command: npx electron-builder --mac --publish never
      notarize-check-artifact-root: release
      signing-mode: standard
      notarize-mode: hook
      publish-mode: artifacts
      publish-release: false
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}

  publish-npm:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci --legacy-peer-deps
      - name: Verify version matches tag
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run build:cli
      - run: npm publish --access public --provenance

  publish-release:
    needs: [desktop, publish-npm]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
