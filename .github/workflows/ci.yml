name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The embedded inkjs runtime and version stamp are generated from
      # package.json/inkjs. Fail the build if a dependency bump or version
      # change did not regenerate them.
      - name: Verify generated files are current
        run: |
          npm run embed:runtime
          npm run embed:version
          git diff --exit-code -- src/shared/inkRuntime.generated.ts src/shared/version.generated.ts

      # Compile the shared modules + CLI (the web server imports out/shared).
      - name: Build CLI and shared
        run: npm run build:cli

      - name: Check web server syntax
        run: |
          node --check server/index.js
          node --check server/queue.js

      - name: Build app
        run: npm run build
